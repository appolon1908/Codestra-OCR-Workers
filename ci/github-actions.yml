# Inactive template: copy to .github/workflows/ci.yml (needs a token with `workflow` scope).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # ruff, ruff format, mypy --strict, OpenAPI exact match, unit + real-Tesseract
      # integration tests all run inside the image's `test` stage.
      - name: Quality gate (docker test stage)
        run: docker build --target test -t codestra-ocr-workers:test .
      - name: Runtime image
        run: docker build -t codestra-ocr-workers:ci .
      - name: Smoke test
        run: |
          docker run -d --name ocr --read-only --tmpfs /tmp --cap-drop ALL \
            -p 127.0.0.1:8080:8080 codestra-ocr-workers:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/readyz
          test "$(docker exec ocr id -u)" = "10001"
          docker rm -f ocr
